severity_scale:
  0: no_disruption_or_irrelevant
  1: low_or_localized_disruption
  2: moderate_operational_disruption
  3: high_regional_or_multi_actor_disruption
  4: severe_systemic_or_key_route_disruption

article_aggregation:
  primary_peak: median overall_disruption_max across the three models
  secondary_breadth: equal-weight mean of the seven dimension-level model medians

weekly_aggregation:
  novelty_weight: 1 / sqrt(duplicate_group_size)
  media_correction: weighted_score_sum / log(1 + weekly_article_count)
  forecast_standardization: training-window or prior-only statistics
