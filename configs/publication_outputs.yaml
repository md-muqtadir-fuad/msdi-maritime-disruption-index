version: publication_v001

# Stage 10 is a deterministic presentation layer. It never refits models,
# changes registered families, or promotes observational evidence to causality.
guardrails:
  primary_frequency: weekly
  monthly_role: robustness
  human_validation_required: true
  publication_eligible_without_human_validation: false
  causal_claim_allowed: false
  economic_importance_claim_allowed: false
  point_rank_is_not_formal_superiority: true
  temporal_precedence_is_not_structural_causality: true
  dml_interpretation: orthogonalized_predictive_association_only
  var_identification: reduced_form_exploratory_only

