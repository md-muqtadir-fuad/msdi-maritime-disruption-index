outputs:
  tables_directory: outputs/tables
  figures_directory: outputs/figures
  reports_directory: outputs/reports
  logs_directory: outputs/logs
  workbook_suffix: publication_tables.xlsx
  report_suffix: results_summary.md
  manifest_suffix: manifest.json
  source_audit_suffix: source_audit.csv
  script_sha256_lock: configs/publication_outputs_script.sha256

figures:
  dpi: 220
  formats: [png, pdf]
  style: seaborn-v0_8-whitegrid
  color_primary: "#1f4e79"
  color_secondary: "#c55a11"
  color_robustness: "#6b7280"
  color_warning: "#b91c1c"

forecast_trajectory_figures:
  horizon_steps: 1
  source_type: score_hybrid
  score_source: score_median
  algorithms: [glm, lstm, prophet, random_forest, xgboost]
  signals: [overall_disruption_max, dimension_mean7]
  weekly_constructions: [weekly_log_volume]
  monthly_constructions: [adapted_pdf_sqrt_ema3, mean_safe_weekly]
  actual_column: actual_scfi_level
  prediction_column: predicted_scfi_level
  interpretation: frozen_out_of_sample_forecasts_not_in_sample_fitted_values

expected:
  source_manifests: 8
  minimum_tables: 14
  figure_basenames: 15
  source_contracts_all_pass: true
  significance_claim_gates_all_pass: true
  significance_source_contracts_all_pass: true
  significance_uncertainty_groups_all_pass: true
  primary_forecast_hypotheses: 100
  adjusted_primary_improvements: 0
  adjusted_primary_worsenings: 21
