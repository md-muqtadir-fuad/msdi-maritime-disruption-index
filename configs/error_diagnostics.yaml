version: error_diagnostics_v001

# Stage 09b diagnoses forecast failures and consolidates already-estimated
# dynamic/DML diagnostics. It does not identify a structural causal effect.
identification:
  causal_claim_allowed: false
  interpretation: predictive_error_diagnostics_and_observational_model_checks
  diagnostic_pass_does_not_validate_identification: true

analysis:
  primary_frequency: monthly
  weekly_role: higher_frequency_robustness
  frozen_common_article_cohort: 6480
  common_cohort_required: true
  score_scale: [0, 4]
  weekly_index_construction: weekly_log_volume
  monthly_index_constructions:
    - mean_safe_weekly
    - adapted_pdf_sqrt_ema3
  weekly_horizons: [1, 2, 4, 8, 12]
  monthly_horizons: [1, 3, 6]
  nonlinear_algorithms:
    - glm
    - lstm
    - prophet
    - random_forest
    - xgboost
  nonlinear_frequency_construction_horizon_cells: 11
  nonlinear_selected_algorithm_cells: 55
  nonlinear_models_per_cell: 3
  nonlinear_selected_prediction_rows: 31440
  required_reference_specifications:
    - no_msdi
    - peak_only
    - breadth_only
    - peak_and_breadth
  supplementary_scope: all_successful_stage09_forecast_specifications

inputs:
  robustness_manifest: outputs/robustness/robustness_v001_manifest.json
  causal_ml_manifest: outputs/causal_ml/causal_ml_v001_manifest.json
  article_scores: data/05_indices/article_level/article_consensus_scores.csv
  weekly_panel: data/06_model_ready/prediction/msdi_scfi_weekly_panel.csv
  monthly_panel: data/06_model_ready/prediction/llm_specific_scfi_monthly_panel.csv

upstream_contracts:
  require_manifest_hash_match: true
  require_robustness_full_computational_scope: true
  require_robustness_status:
    - complete_computational_scope_pending_human_validation
  require_robustness_causal_claim_allowed_false: true
  require_reference_reconstruction_passed: true
  require_forecast_horizon_purge_passed: true
  require_nonlinear_common_origins_passed: true
  require_causal_ml_causal_claim_allowed_false: true
  fail_closed: true
  # Stage 07d must now publish its own prediction hash and row count. This
  # keeps the integrity contract tied to the run manifest while allowing the
  # pre-specified five-model set (including GLM) to change the artifact size.
  require_stage07d_output_hashes: true
  require_stage07d_output_row_counts: true

forecast_error:
  sign_convention: actual_minus_predicted
  positive_error_interpretation: underprediction
  negative_error_interpretation: overprediction
  outcomes:
    - log_change
    - reconstructed_scfi_level
  summaries:
    - bias
    - median_error
    - mae
    - rmse
    - directional_accuracy
    - underprediction_share
    - normalized_absolute_error
    - normalized_squared_error
  normalized_loss:
    denominator: past_only_trailing_target_scale
    scale_statistic: standard_deviation
    weekly_window: 13
    weekly_minimum_periods: 8
    monthly_window: 6
    monthly_minimum_periods: 4
    shift_periods: 1
    minimum_positive_scale: 1.0e-12
    insufficient_history_label: insufficient_history

residual_tests:
  alpha: 0.05
  minimum_observations: 20
  ljung_box:
    enabled: true
    weekly_lags: [4, 8, 12]
    monthly_lags: [1, 3, 6]
    lag_must_be_less_than_sample_size: true
    null: no_residual_autocorrelation_through_lag
  arch_lm:
    enabled: true
    weekly_lags: [4, 8, 12]
    monthly_lags: [1, 3, 6]
    lag_must_be_less_than_sample_size: true
    null: no_conditional_heteroskedasticity_through_lag
  jarque_bera:
    enabled: true
    null: residual_normality
  inference_role: model_adequacy_diagnostics_not_confirmatory_economic_hypotheses

calibration:
  method: mincer_zarnowitz
  equation: actual_log_change_equals_alpha_plus_beta_times_predicted_log_change
  null_intercept: 0.0
  null_slope: 1.0
  joint_wald_test: true
  covariance: hac
  hac_max_lag_rule: max_horizon_and_newey_west_sample_rule
  report:
    - intercept
    - slope
    - standard_errors_hac
    - confidence_intervals
    - raw_intercept_p_value
    - raw_slope_equals_one_p_value
    - raw_joint_wald_p_value

stability:
  cusum:
    enabled: true
    method: standardized_forecast_error_brownian_bridge
    confidence_level: 0.95
    two_sided_critical_value: 1.36
    minimum_observations: 20
  rolling_error:
    weekly_window: 26
    weekly_minimum_periods: 13
    monthly_window: 12
    monthly_minimum_periods: 6
    statistics: [bias, mae, rmse]
  operational_split:
    name: operational_shipping_disruption_period
    disruption_period_start: "2020-03-01"
    disruption_period_end: "2022-06-30"
    official_pandemic_dates: false
    labels: [pre_disruption, disruption_period, post_disruption]
    interpretation: pre_specified_operational_split_not_official_pandemic_dating

volatility_regime:
  information_contract: origin_known_past_only
  source: realized_one_period_scfi_log_change
  rolling_statistic: standard_deviation
  shift_periods: 1
  weekly_window: 13
  weekly_minimum_periods: 8
  monthly_window: 6
  monthly_minimum_periods: 4
  high_threshold: expanding_past_only_quantile
  high_quantile: 0.75
  threshold_excludes_current_observation: true
  labels: [insufficient_history, normal_volatility, high_volatility]
  future_mutation_invariance_required: true

error_drivers:
  interpretation: descriptive_predictive_association_not_causality
  outcomes:
    continuous: log1p_normalized_absolute_error
    binary: extreme_absolute_error_flag
  continuous_model:
    estimator: ols_hac
    covariance: hac
  binary_model:
    estimator: logistic_regression_l2
    penalty_strength: 1.0
    class_weight: balanced
    inference_role: prediction_only_no_logit_p_values
  predictors:
    - past_only_market_volatility
    - peak_model_disagreement
    - dimension_model_disagreement
    - log1p_article_count
    - source_count
    - effective_article_count
    - peak_signal
    - breadth_signal
    - brent_log_change
    - control_missing_count
    - operational_regime_indicators
  predictor_standardization:
    method: robust_zscore
    center: median
    scale: 1.4826_times_median_absolute_deviation
    zero_scale_nonmissing_value: 0.0
  minimum_observations_per_parameter: 10
  collinearity_policy: deterministic_rank_revealing_drop
  report_feature_status: true

extreme_cases:
  selection_basis: forecast_error_within_frequency_construction_horizon_specification
  reference_specifications_only: true
  largest_underpredictions_per_cell: 10
  largest_overpredictions_per_cell: 10
  largest_absolute_errors_per_cell: 10
  robust_z_absolute_threshold: 3.0
  retain_ties: true
  trace_common_articles_only: true
  maximum_articles_per_case_and_role: 10
  article_rank: absolute_novelty_weighted_score_contribution
  trace_roles:
    origin_information: articles_in_signal_window_known_at_forecast_origin
    outcome_context: articles_after_origin_through_target_date_not_known_at_origin
  required_article_fields:
    - article_id
    - publication_date
    - headline
    - source_domain
    - duplicate_group_id
    - duplicate_group_size
    - peak_severity_score
    - breadth_severity_score
    - dimension_disagreement_sd_mean
    - novelty_weight
  event_claim_guardrail: article_trace_is_context_not_event_identification

dynamic_consolidation:
  refit_models: false
  sources:
    - varx_diagnostics_sensitivity
    - selected_dynamic_lags
    - conditional_granger_sensitivity
    - conventional_granger_sensitivity
    - pcmci_link_stability
    - local_projection_sensitivity
  checks:
    - var_stability
    - residual_autocorrelation
    - residual_heteroskedasticity
    - residual_normality
    - lag_sensitivity
    - pcmci_link_stability
  interpretation:
    granger: predictive_precedence_not_structural_causality
    pcmci: conditional_temporal_dependency_not_causal_graph
    local_projection: observational_dynamic_association

dml_consolidation:
  refit_models: false
  sources:
    - causal_ml_sensitivity
    - causal_ml_source_audit
    - future_lead_placebos
    - nuisance_fold_audit
    - overlap_diagnostics
    - treatment_invariance_audit
  checks:
    - nuisance_oof_rmse_and_r_squared
    - horizon_purge_and_embargo
    - treatment_horizon_invariance
    - conditional_treatment_variation
    - information_effective_sample_size
    - influential_observation_share
    - training_support_extrapolation
    - learner_sign_stability
    - hac_block_bootstrap_concordance
    - pre_treatment_and_future_lead_falsification
  interpretation: orthogonalized_predictive_effect_under_unverified_conditional_exchangeability
  no_diagnostic_can_upgrade_causal_claim: true

inference_handoff:
  downstream_stage: 09c_significance_analysis
  alpha: 0.05
  confidence_level: 0.95
  emit_raw_p_values: true
  adjust_p_values_in_this_stage: false
  required_identity_fields:
    - diagnostic_id
    - hypothesis_family_id
    - primary_family
    - raw_p_value
    - effect_size
    - sample_size
  primary_family_correction_reserved_for_09c: holm
  exploratory_family_correction_reserved_for_09c: benjamini_hochberg

output_contract:
  require_unique_keys: true
  hash_all_inputs_and_outputs: true
  atomic_writes: true
  publication_run_rejects_debug_limits: true
  manifest_causal_claim_allowed: false
  # Four-model output sizes are frozen in this stage's manifest after the
  # complete run. Do not inherit row counts from an earlier scorer set.
  expected_full_row_counts: {}
  tables:
    - forecast_error_summary
    - forecast_error_by_operational_regime
    - forecast_error_by_volatility_regime
    - forecast_residual_tests
    - mincer_zarnowitz_calibration
    - forecast_stability
    - error_driver_coefficients
    - error_driver_performance
    - extreme_forecast_cases
    - extreme_case_article_trace
    - dynamic_diagnostic_consolidation
    - dml_diagnostic_consolidation
    - raw_significance_handoff
    - source_contract_audit
