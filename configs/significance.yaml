version: significance_v001

# Stage 09c is the sole consolidated multiplicity-correction layer. It does
# not refit models, change upstream specifications, or authorize causal claims.
identification:
  causal_claim_allowed: false
  publication_claim_ready: false
  human_validation_required: true
  interpretation: multiplicity_aware_statistical_audit_not_causal_identification

analysis:
  alpha: 0.05
  confidence_level: 0.95
  primary_frequency: monthly
  weekly_role: higher_frequency_robustness
  frozen_common_article_cohort: 6480

inputs:
  error_diagnostics_manifest: outputs/diagnostics/error_diagnostics_v001_manifest.json
  robustness_manifest: outputs/robustness/robustness_v001_manifest.json
  prediction_manifest: outputs/prediction_benchmarks/forecast_v001_manifest.json
  weekly_llm_manifest: outputs/llm_scfi_comparison/llm_scfi_v001_manifest.json
  monthly_llm_manifest: outputs/llm_scfi_comparison/llm_scfi_monthly_v001_manifest.json
  required_error_diagnostics_outputs:
    - raw_significance_handoff
    - dml_diagnostic_consolidation
    - forecast_error_summary
    - mincer_zarnowitz_calibration
    - error_driver_coefficients
    - source_contract_audit
    - reference_index_reconstruction_audit
  required_robustness_outputs:
    - ablation_tests
    - nonlinear_statistical_tests
    - peak_breadth_difference
    - ardl_ecm_sensitivity
    - varx_coefficients_sensitivity
    - upstream_audit
    - varx_diagnostics_sensitivity
    - conditional_granger_sensitivity
    - conventional_granger_sensitivity
    - local_projection_sensitivity
    - pcmci_sensitivity_links

  # Prefer a manifest-declared output hash/count whenever the producing stage
  # provides one. The two LLM-comparison fallbacks remain only for their legacy
  # manifests; the revised Stage 07 benchmark contract must be manifest-native.
  trusted_legacy_inference_tables:
    prediction:
      manifest_version: forecast_v001
      manifest_status: provisional_pending_human_validation
      output_key: statistical_tests
      expected_rows: 180
      require_manifest_output_contract: true
    weekly_llm:
      manifest_version: llm_scfi_v001
      manifest_status: provisional_pending_human_validation
      output_key: statistical_tests
      expected_rows: null
      require_manifest_output_contract: true
    monthly_llm:
      manifest_version: llm_scfi_monthly_v001
      manifest_status: provisional_pending_human_validation
      output_key: statistical_tests
      expected_rows: null
      require_manifest_output_contract: true

upstream_contracts:
  error_diagnostics_version: error_diagnostics_v001
  error_diagnostics_status: complete_computational_scope_pending_human_validation
  robustness_version: robustness_v001
  robustness_status: complete_computational_scope_pending_human_validation
  require_all_source_contracts_passed: true
  require_all_reference_reconstructions_passed: true
  require_no_upstream_p_value_adjustment_in_09b: true
  require_legacy_manifest_hash_match_stage09_upstream_audit: true
  require_causal_claim_allowed_false: true
  fail_closed: true

# Earliest frozen family ownership is retained. Stage 09's three-row direct
# monthly peak-only family is a semantic subset of the Stage 07c hybrid family and may not
# be used to shrink the multiplicity burden after results are known.
confirmatory_primary_families:
  source_table: stage07c_monthly_llm_statistical_tests
  family_ids:
    - monthly_primary_hybrid_vs_coverage__diebold_mariano_squared
    - monthly_primary_llm_pairwise__diebold_mariano_squared
    - monthly_primary_llm_vs_coverage__diebold_mariano_squared
  expected_family_sizes:
    monthly_primary_hybrid_vs_coverage__diebold_mariano_squared: 24
    monthly_primary_llm_pairwise__diebold_mariano_squared: 36
    monthly_primary_llm_vs_coverage__diebold_mariano_squared: 24
  frequency: monthly
  index_construction: adapted_pdf_sqrt_ema3
  horizons: [1, 3, 6]
  main_test: diebold_mariano_hac_two_sided
  effect_convention: baseline_loss_minus_challenger_loss
  positive_effect_interpretation: challenger_improves_forecast_accuracy
  negative_effect_interpretation: challenger_worsens_forecast_accuracy
  correction: holm

semantic_duplicate_contract:
  earliest_frozen_family_owns_hypothesis: true
  mappings:
    - comparison_id: peak_vs_no_msdi
      baseline_specification_id: no_msdi
      variant_specification_id: peak_only
      earlier_score_source: score_median
      earlier_signal_name: overall_disruption_max
    - comparison_id: breadth_vs_no_msdi
      baseline_specification_id: no_msdi
      variant_specification_id: breadth_only
      earlier_score_source: score_median
      earlier_signal_name: dimension_mean7
  semantic_match_fields:
    - frequency
    - index_construction
    - normalized_baseline_model
    - normalized_challenger_model
    - horizon
    - loss_test
  numeric_validation_fields:
    - paired_sample_size
    - mean_loss_improvement
  numeric_effect_tolerance: 1.0e-12
  require_unique_earlier_match: true
  expected_stage09_duplicate_rows: 44
  expected_stage09_duplicate_rows_by_frequency:
    weekly: 20
    monthly: 24
  expected_reassigned_primary_rows: 3
  stage09_reassigned_family_id: primary_monthly_peak_vs_no_msdi
  retain_stage09_bootstrap_and_clark_west_as_sensitivity: true
  duplicate_rows_excluded_from_canonical_discoveries: true
  duplicate_rows_retained_in_original_family_reconciliation: true
  varx_coefficients:
    semantic_key:
      - frequency
      - msdi_path
      - selected_lag
      - equation
      - term
    canonical_owner: smallest_maximum_lag_specification
    expected_input_rows: 728
    expected_unique_hypotheses: 500
    expected_duplicate_rows: 228
    require_identical_effect_standard_error_and_p_value: true
  varx_diagnostics:
    semantic_key:
      - frequency
      - msdi_path
      - selected_lag
      - diagnostic
      - variable
      - details
    canonical_owner: smallest_maximum_lag_specification
    expected_input_p_value_rows: 140
    expected_unique_hypotheses: 77
    expected_duplicate_rows: 63
    require_identical_statistic_and_p_value: true

corrections:
  recompute_from_raw_then_reconcile: true
  upstream_adjusted_values_are_audit_only: true
  never_adjust_an_adjusted_p_value: true
  upstream_reconciliation_tolerance: 1.0e-12
  reconcile_complete_upstream_tables_before_semantic_deduplication: true
  canonical_corrections_use_unique_hypotheses_after_deduplication: true
  primary_confirmatory:
    method: holm
    error_rate: family_wise_error_rate
  primary_diagnostic:
    method: holm
    error_rate: family_wise_error_rate
    claim_role: model_diagnostic_not_confirmatory_economic_hypothesis
  prespecified_secondary:
    method: holm
    error_rate: family_wise_error_rate
    claim_role: robustness_not_primary_claim
  exploratory:
    method: benjamini_hochberg
    error_rate: false_discovery_rate
  apply_within_frozen_family: true
  report_global_role_adjustment_as_sensitivity: true
  pooled_role_sensitivity:
    confirmatory_primary: holm
    primary_diagnostic: holm
    prespecified_secondary: holm
    exploratory: benjamini_hochberg
    exclude_semantic_duplicates: true
    exclude_supporting_streams: true
    never_pool_confirmatory_with_diagnostics: true
  never_replace_raw_p_values: true
  rejection_boundary: p_value_less_than_or_equal_to_alpha
  supporting_inference_streams:
    - moving_block_bootstrap_two_sided
    - clark_west_one_sided
  supporting_streams_cannot_replace_main_test: true

registry_sources:
  stage07_prediction_benchmarks:
    role: prespecified_secondary
    family_key: test
  stage07b_weekly_llm:
    primary_prefix: primary_
    secondary_prefix: sensitivity_
    exploratory_prefix: exploratory_
    preserve_upstream_family_and_method: true
  stage07c_monthly_llm:
    monthly_primary_role: confirmatory_primary_for_direct_monthly_construction
    monthly_exploratory_role: exploratory
    preserve_upstream_family_and_method: true
  stage09b_raw_handoff:
    include_all_valid_rows: true
    expected_rows: null
    final_primary_family_true_role: primary_diagnostic
    final_primary_family_false_role: exploratory
    upstream_primary_family_is_audit_only: true
    correction_key_includes_role: true
    expected_diagnostic_family_sizes: {}
    expected_primary_diagnostic_family_sizes: {}
  stage09_ablation:
    p_value: dm_hac_p_value
    effect_size: mean_loss_difference
    standard_error: standard_error_hac
    default_role: exploratory
    family_key:
      - family_id
      - frequency
      - index_construction
      - sample_subset
      - loss
    expected_rows: null
    supporting_streams_are_metadata_not_registry_rows: true
  stage09_nonlinear:
    p_value: p_value
    effect_size: mean_loss_improvement
    standard_error: standard_error
    role: prespecified_secondary
    preserve_upstream_holm: true
    expected_rows: null
    expected_algorithms: [glm, lstm, prophet, random_forest, xgboost]
  stage09_peak_breadth:
    p_value: shared_bootstrap_p_value
    effect_size: coefficient_difference_peak_minus_breadth
    confidence_interval: shared_bootstrap
    role: exploratory
    family_key: [frequency]
    expected_rows: 20
    expected_family_sizes:
      weekly: 13
      monthly: 7
  stage09_ardl_ecm:
    p_value_effect_mappings:
      scfi_error_correction_p_value: scfi_error_correction_coefficient
      msdi_lagged_level_p_value: msdi_lagged_level_coefficient
    role: exploratory
    family_key: [parameter]
    expected_rows_after_pivot: 64
    expected_family_count: 2
    expected_family_size: 32
  stage09_varx_coefficients:
    p_value: p_value
    effect_size: coefficient
    standard_error: standard_error
    role: exploratory
    family_key: [frequency, msdi_path, selected_lag]
    expected_rows: 728
    expected_canonical_rows: 500
    expected_family_count: 7
  stage09_dynamic_handoff_enrichment:
    source_tables:
      - varx_diagnostics_sensitivity
      - conditional_granger_sensitivity
      - conventional_granger_sensitivity
      - local_projection_sensitivity
      - pcmci_sensitivity_links
    audit_only_not_reingested: true
    require_exact_raw_p_value_effect_and_available_sample_match: true
    restore_and_reconcile_exported_bh_families:
      - conditional_granger_sensitivity
      - conventional_granger_sensitivity
      - pcmci_sensitivity_links
    preserve_stage09b_handoff_family_when_no_adjusted_value_was_exported:
      - local_projection_sensitivity
      - varx_diagnostics_sensitivity
  stage09b_dml_handoff_enrichment:
    source_table: dml_diagnostic_consolidation
    restore_global_bh_family_from_p_value_fdr_all: true
    expected_enriched_rows:
      stage08b_placebo_tests: 48
      stage09_causal_ml_sensitivity: 48
      stage09_future_lead_placebos: 16

expected_registry_counts:
  main_rows_before_semantic_deduplication: null
  semantic_duplicate_rows: null
  canonical_main_rows: null
  supporting_bootstrap_and_clark_west_are_not_main_rows: true

claim_guardrails:
  statistical_significance_requires_effect_direction: true
  economic_magnitude_must_be_reported_with_significance: true
  no_economic_importance_claim_without_prespecified_threshold: true
  two_sided_rejection_alone_does_not_show_improvement: true
  clark_west_rejection_cannot_override_negative_realized_loss_improvement: true
  diagnostics_do_not_test_the_main_economic_hypothesis: true
  granger_is_predictive_precedence_only: true
  pcmci_is_conditional_temporal_dependence_only: true
  dml_is_orthogonalized_predictive_effect_under_unverified_assumptions: true
  no_result_can_upgrade_causal_claim: true

output_contract:
  directory: outputs/significance
  log_directory: outputs/logs
  require_unique_test_ids: true
  atomic_writes: true
  hash_all_inputs_and_outputs: true
  publication_run_rejects_debug_limits: true
  full_status: complete_computational_scope_pending_human_validation
  debug_status: partial_debug_scope_not_publication_eligible
  failure_policy: abort_fail_closed
  publication_scope_complete_on_full_pass: true
  publication_eligible_without_human_validation: false
  manifest_must_record_runtime_script_hash: true
  script_sha256_lock: configs/significance_script.sha256
  full_status_requires_script_sha256_lock_match: true
  required_claim_gates:
    - registry_rows_before_semantic_deduplication
    - semantic_duplicate_rows
    - canonical_main_rows
    - duplicate_audit_rows
    - unique_hypothesis_ids
    - unique_canonical_semantic_keys
    - all_duplicates_reference_existing_canonical_owner
    - canonical_rows_are_not_marked_duplicates
    - raw_p_values_valid
    - canonical_adjusted_p_values_complete
    - canonical_correction_family_sizes_match_membership
    - family_summary_contains_only_canonical_families
    - canonical_effect_sizes_complete
    - adjusted_rejections_have_effect_magnitude
    - required_registry_fields
    - all_source_contracts
    - upstream_adjustment_reconciliation
    - upstream_adjustment_coverage
    - all_uncertainty_effect_size_gates
    - no_causal_claim_allowed
    - monthly_primary_present
  required_registry_fields:
    - hypothesis_id
    - semantic_key
    - source_stage
    - source_table
    - evidence_domain
    - inference_role
    - null_hypothesis
    - alternative
    - sidedness
    - effect_metric
    - effect_unit
    - effect_size
    - standard_error
    - ci_lower
    - ci_upper
    - uncertainty_method
    - ci_available
    - ci_unavailable_reason
    - sample_size
    - sample_start_date
    - sample_end_date
    - sample_dates_unavailable_reason
    - index_construction_unavailable_reason
    - signed_effect_interpretable
    - rejection_meaning
    - claim_direction
    - raw_p_value
    - correction_family_id
    - correction_family_size
    - correction_method
    - adjusted_p_value_within_family
    - adjusted_p_value_global_role
    - upstream_adjustment_delta
    - canonical_inference
    - duplicate_of
    - causal_claim_allowed
  tables:
    - significance_registry
    - significance_family_summary
    - significance_domain_summary
    - primary_forecast_inference
    - primary_claim_summary
    - semantic_duplicate_audit
    - upstream_adjustment_reconciliation
    - upstream_adjustment_coverage_audit
    - uncertainty_effect_size_audit
    - exploratory_adjusted_rejections
    - pooled_role_sensitivity
    - claim_gate_audit
    - source_contract_audit
