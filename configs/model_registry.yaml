llm_models:
  open_reproducible:
    - name: qwen_or_mistral_candidate
      provider: local_or_open_weights
      role: reproducible scoring baseline
  commercial_benchmark:
    - name: to_be_filled
      provider: to_be_filled
      role: high-quality scoring benchmark

active_scoring_models:
  - alias: gemma_2_9b_it
    name_contains: gemma-2-9b-it
    parameter_count_billion: 9
  - alias: qwen_3_8b
    name_contains: qwen-3
    parameter_count_billion: 8
  - alias: qwen_2_5_7b
    name_contains: qwen2.5
    parameter_count_billion: 7
  - alias: glm_4_9b_0414
    name_contains: glm-4-9b-0414
    parameter_count_billion: 9

topsis_operational_ranking:
  # This ranking is reported separately and never weights the median MSDI.
  criteria:
    scoring_success_rate:
      direction: benefit
      weight: 0.25
    mean_pairwise_spearman:
      direction: benefit
      weight: 0.15
    parameter_count_billion:
      direction: cost
      weight: 0.15
    median_inference_seconds:
      direction: cost
      weight: 0.25
    median_input_tokens:
      direction: cost
      weight: 0.10
    median_generated_tokens:
      direction: cost
      weight: 0.10

ml_baselines:
  - tfidf_logistic_regression
  - tfidf_linear_svm
  - xgboost_classifier
  - sentence_transformer_classifier

metadata_to_log:
  - model_name
  - provider
  - model_version_or_date
  - prompt_version
  - temperature
  - seed
  - raw_response
  - parsed_json
  - parsing_errors
