version: causal_ml_v001

# This stage estimates orthogonalized predictive effects. It does not turn the
# observational MSDI innovation into an exogenous treatment.
identification:
  status: observational_unverified_conditional_exchangeability
  causal_claim_allowed: false
  instrument: null
  negative_control_available: false
  route_panel_available: false

treatment:
  definition: first_difference_of_msdi_path_residualized_out_of_fold
  scale: one_frozen_past_only_calibration_residual_standard_deviation
  primary_path: peak
  paths:
    peak: peak_score_media_corrected
    breadth: breadth_score_media_corrected
  monthly_paths:
    peak: peak_score_media_corrected_mean
    breadth: breadth_score_media_corrected_mean
  script08_innovations_role: comparison_only_full_sample_residuals_not_used_as_dml_treatment

outcome:
  definition: impact_inclusive_cumulative_scfi_log_change
  formula: log_scfi_t_plus_h_minus_log_scfi_t_minus_1

frequencies:
  weekly:
    role: higher_frequency_robustness
    panel: data/06_model_ready/prediction/msdi_scfi_weekly_panel.csv
    date_column: observation_date
    scfi_column: scfi
    brent_column: brent_price
    article_count_column: article_count
    source_count_column: source_count
    horizons: [1, 2, 4, 8, 12]
    confounder_lags: [1, 2, 3, 4, 8, 12]
    minimum_training_rows: 156
    refit_every: 13
    volatility_window: 13
    minimum_complete_date: null
  monthly:
    role: primary
    panel: data/06_model_ready/causality/msdi_scfi_monthly_panel.csv
    date_column: month_ending
    scfi_column: scfi_monthly_mean
    brent_column: brent_monthly_mean
    article_count_column: article_count_sum
    source_count_column: source_count_mean
    horizons: [1, 3, 6]
    confounder_lags: [1, 2, 3, 6]
    minimum_training_rows: 60
    refit_every: 3
    volatility_window: 6
    minimum_complete_date: 2016-03-31

features:
  lagged_dynamic_variables:
    - scfi_return
    - msdi_change
    - brent_return
    - news_volume_change
  lag_one_levels:
    - scfi_log
    - msdi_level
    - brent_log
    - log_news_volume
    - source_count
  lag_one_optional_measurement_controls:
    - peak_model_disagreement
    - dimension_disagreement
    - port_disruption
    - global_container_movement_disruption
    - supply_disruption
    - production_disruption
    - demand_disruption
    - cpb_world_trade_volume
    - unctad_china_core_lane_lsbci
  deterministic_controls:
    - season_sin
    - season_cos
    - linear_time

learners:
  primary: elastic_net
  report_all:
    - histogram_gradient_boosting
    - elastic_net
    - random_forest
  histogram_gradient_boosting:
    learning_rate: 0.05
    max_iter: 200
    max_leaf_nodes: 15
    min_samples_leaf: 10
    l2_regularization: 1.0
  elastic_net:
    alpha: 0.01
    l1_ratio: 0.5
    max_iter: 20000
  random_forest:
    n_estimators: 300
    max_depth: 6
    min_samples_leaf: 5
    max_features: 0.7
    n_jobs: 1

inference:
  alpha: 0.05
  confidence_level: 0.95
  hac_minimum_lags: 1
  moving_block_bootstrap_repetitions: 999
  block_length_rule: max_horizon_and_ceil_cube_root_n
  primary_family_correction: holm
  exploratory_family_correction: benjamini_hochberg

heterogeneity:
  role: exploratory_group_average_orthogonalized_effects
  causal_forest_enabled: false
  causal_forest_reason: requires_defensible_average_effect_identification_and_econml
  minimum_group_rows:
    weekly: 30
    monthly: null
  horizons:
    weekly: [4]
    monthly: []
  modifiers:
    - covid_regime
    - lagged_market_volatility_regime
    - lagged_news_intensity_regime
    - lagged_model_disagreement_regime

falsification:
  placebo_outcome: log_scfi_t_minus_1_minus_log_scfi_t_minus_h_minus_1
  placebo_treatment_leads: not_used_because_they_overlap_forward_outcome_windows
  negative_control: unavailable_not_fabricated
